[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "figio"
# version = "0.0.8"
dynamic = ["version"]  # Removed static version, now determined by VCS
description = "A declarative method for plotting (x, y) and histogram data"
requires-python = '>=3.10,<3.15'
readme = "README.md"
authors = [
  {email = 'chovey@sandia.gov', name = 'Chad B. Hovey'},
  {email = 'mrbuche@sandia.gov', name = 'Michael R. Buche'},
]
classifiers = [
  'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
  'Development Status :: 5 - Production/Stable',
  'Intended Audience :: Science/Research',
  'Topic :: Scientific/Engineering',
  'Programming Language :: Python',
]
dependencies = [
  "matplotlib",
  "numpy",
  "pyyaml",
  "schema",
  "scipy",
  "tzlocal",
]

[project.optional-dependencies]
dev = [
  "black",
  "build",
  "hatch",
  "pdoc",
  "pre-commit",
  "pycodestyle",
  "pytest",
  "pytest-cov",
  "twine",
]

# Entry Points
[project.scripts]
figio="figio.command_line:main"
#fingerprint="figio.fingerprint_md5:main"

[project.urls]
Documentation = 'https://figio.readthedocs.io'
Homepage = 'https://autotwin.github.io/figio'
Repository = 'https://github.com/autotwin/figio'

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"  # Ensures clean versions like 0.0.9 instead of 0.0.9+g1234567

[tool.hatch.build.targets.wheel]
packages = ["src/figio"]

[tool.pytest.ini_options]
python_files = ["*.py"]
testpaths = ["tests/"]
pythonpath = ["src"]

